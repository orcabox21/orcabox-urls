name: Update provider URLs

on:
  schedule:
    # 03:15 UTC daily (~08:45 IST). Cron on GitHub is UTC only.
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-urls
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the commit step rebases before pushing, which is
          # unreliable on the depth-1 clone checkout makes by default.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check provider URLs
        id: check
        run: node scripts/check-urls.mjs

      - name: Commit updated urls.json
        if: steps.check.outputs.changed == 'true'
        # SUMMARY arrives via env, not `${{ }}` interpolation: it carries
        # hostnames harvested from third-party redirects, and interpolating
        # those straight into the shell is the standard Actions injection hole.
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urls.json
          if git diff --cached --quiet; then
            echo "No staged change to urls.json; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update provider URLs" -m "$SUMMARY"
          # Someone may have edited urls.json on github.com while this ran;
          # rebase rather than fail the job and lose the update.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
