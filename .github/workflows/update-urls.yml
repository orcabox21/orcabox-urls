name: Update provider URLs

on:
  schedule:
    # 03:15 UTC daily (~08:45 IST). Cron on GitHub is UTC only.
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-urls
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check provider URLs
        id: check
        run: node scripts/check-urls.mjs

      - name: Commit updated urls.json
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urls.json
          git commit -m "chore: update provider URLs

          ${{ steps.check.outputs.summary }}"
          git push
